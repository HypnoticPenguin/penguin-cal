<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#1e293b" stroke="#2196F3" stroke-width="16"/>
  
  <!-- Penguin Body -->
  <ellipse cx="256" cy="280" rx="130" ry="150" fill="#0f172a"/>
  <!-- Penguin White Belly -->
  <ellipse cx="256" cy="295" rx="90" ry="115" fill="#f8fafc"/>
  
  <!-- Head / Face Mask -->
  <path d="M 156 180 C 156 120, 356 120, 356 180 C 356 220, 310 240, 256 240 C 202 240, 156 220, 156 180 Z" fill="#0f172a"/>
  
  <!-- Eyes -->
  <circle cx="215" cy="185" r="14" fill="#f8fafc"/>
  <circle cx="215" cy="185" r="6" fill="#0f172a"/>
  <circle cx="297" cy="185" r="14" fill="#f8fafc"/>
  <circle cx="297" cy="185" r="6" fill="#0f172a"/>
  
  <!-- Beak -->
  <polygon points="256,200 236,225 276,225" fill="#f59e0b"/>
  
  <!-- Feet -->
  <ellipse cx="200" cy="415" rx="35" ry="15" fill="#f59e0b"/>
  <ellipse cx="312" cy="415" rx="35" ry="15" fill="#f59e0b"/>
  
  <!-- Mini Calendar Badge (Calendar theme) -->
  <g transform="translate(310, 75) scale(1.3)">
    <!-- Calendar Base -->
    <rect x="0" y="10" width="55" height="50" rx="6" fill="#ffffff" stroke="#2196F3" stroke-width="4"/>
    <!-- Calendar Header Top Bar -->
    <path d="M 0 16 C 0 12, 4 8, 8 8 L 47 8 C 51 8, 55 12, 55 16 L 55 24 L 0 24 Z" fill="#2196F3"/>
    <!-- Ring Hooks -->
    <line x1="15" y1="4" x2="15" y2="10" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="4" x2="40" y2="10" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
    <!-- Calendar Dots/Grid Lines -->
    <circle cx="15" cy="35" r="3" fill="#2196F3"/>
    <circle cx="27" cy="35" r="3" fill="#2196F3"/>
    <circle cx="39" cy="35" r="3" fill="#2196F3"/>
    <circle cx="15" cy="47" r="3" fill="#94a3b8"/>
    <circle cx="27" cy="47" r="3" fill="#94a3b8"/>
    <circle cx="39" cy="47" r="3" fill="#2196F3"/>
  </g>
</svg>
