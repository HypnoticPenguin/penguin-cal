<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- White Background Container Box (Ensures theme compatibility) -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />

  <g transform="translate(0, -2)">
    <!-- Penguin Outer Body -->
    <ellipse cx="64" cy="72" rx="34" ry="44" fill="#263238" />

    <!-- Feet -->
    <path d="M 44 112 Q 38 120 48 122 Q 54 120 54 112 Z" fill="#FF9800" />
    <path d="M 84 112 Q 90 120 80 122 Q 74 120 74 112 Z" fill="#FF9800" />

    <!-- Penguin Inner White Tummy & Face -->
    <path d="M 64 36 Q 44 36 42 68 Q 40 102 64 102 Q 88 102 86 68 Q 84 36 64 36 Z" fill="#FFFFFF" />

    <!-- Penguin Flippers/Wings -->
    <path d="M 30 64 C 20 74 22 88 34 86 Z" fill="#1C2529" />
    <path d="M 98 64 C 108 74 106 88 94 86 Z" fill="#1C2529" />

    <!-- Eyes -->
    <ellipse cx="53" cy="50" rx="3.5" ry="4.5" fill="#1A2327" />
    <ellipse cx="75" cy="50" rx="3.5" ry="4.5" fill="#1A2327" />
    <circle cx="54.5" cy="48.5" r="1.2" fill="#FFFFFF" />
    <circle cx="76.5" cy="48.5" r="1.2" fill="#FFFFFF" />

    <!-- Beak -->
    <path d="M 58 56 Q 64 64 70 56 Q 64 53 58 56 Z" fill="#FFA726" />

    <!-- Cozy Scarf -->
    <path d="M 42 60 Q 64 68 86 60 Q 84 67 64 70 Q 44 67 42 60 Z" fill="#2196F3" />
    <path d="M 72 67 L 75 82 L 83 81 L 78 65 Z" fill="#1976D2" />

    <!-- Open Calendar / Diary Book -->
    <path d="M 36 84 Q 52 82 62 87 L 62 108 Q 50 104 36 106 Z" fill="#F5F5F5" stroke="#D1D5DB" stroke-width="1"/>
    <path d="M 92 84 Q 76 82 66 87 L 66 108 Q 78 104 92 106 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    
    <!-- Diary Spine -->
    <line x1="64" y1="85" x2="64" y2="108" stroke="#1976D2" stroke-width="2" stroke-linecap="round"/>

    <!-- Calendar Page Lines & Highlight -->
    <line x1="42" y1="90" x2="56" y2="89" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="95" x2="58" y2="94" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="100" x2="55" y2="99" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>

    <line x1="72" y1="90" x2="86" y2="89" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
    <rect x="72" y="94" width="6" height="6" rx="1" fill="#FF5252" />
    <line x1="81" y1="97" x2="86" y2="97" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bookmark Ribbon -->
    <path d="M 64 85 Q 68 92 70 114 L 66 112 L 63 114 Z" fill="#FF5252" />
  </g>
</svg>
