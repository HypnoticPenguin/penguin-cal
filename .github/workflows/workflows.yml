name: CI/CD Release & Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push version updates, tags, and releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version in frontend/package.json
        id: version-bump
        working-directory: ./frontend
        run: |
          # Increment patch version (e.g., 0.1.0 -> 0.1.1) using npm[cite: 2]
          npm version patch --no-git-tag-version
          
          # Extract the new version into an environment variable
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped version to v$NEW_VERSION"

      - name: Commit version change and tag
        env:
          NEW_TAG: v${{ steps.version-bump.outputs.NEW_VERSION }}
        run: |
          TAG="${{ env.NEW_TAG }}"
          
          # 1. Fetch latest changes and tags from origin (GitHub) to prevent out-of-sync conflicts
          git fetch origin main
          
          # 2. If the tag already exists, automatically bump it until unique
          while git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin | grep -qw "$TAG"; do
            echo "Tag $TAG already exists. Incrementing version..."
            cd frontend
            npm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            cd ..
            TAG="v$NEW_VERSION"
          done
          
          FINAL_VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "NEW_VERSION=$FINAL_VERSION" >> $GITHUB_OUTPUT
          
          # 3. Stage and commit package.json explicitly from root context
          git add frontend/package.json
          git status
          git commit -m "chore(release): bump version to $TAG [skip ci]" || echo "No changes to commit"
          
          # 4. Pull with rebase incorporating any remote updates safely
          git pull --rebase origin main
          
          # 5. Clean up any local duplicate tags, set the fresh tag, and push to GitHub
          git tag -d "$TAG" 2>/dev/null || true
          git tag "$TAG"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version-bump.outputs.NEW_VERSION }}
          name: Release v${{ steps.version-bump.outputs.NEW_VERSION }}
          generate_release_notes: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            mmozzano/penguin-cal-backend:latest
            mmozzano/penguin-cal-backend:${{ steps.version-bump.outputs.NEW_VERSION }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64,linux/arm/v7                     
          file: ./frontend/Dockerfile
          push: true
          tags: |
            mmozzano/penguin-cal-frontend:latest
            mmozzano/penguin-cal-frontend:${{ steps.version-bump.outputs.NEW_VERSION }}