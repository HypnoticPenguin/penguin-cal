services:
  backend:
    image: mmozzano/penguin-cal-backend:latest
    environment:
      - TZ=Europe/London
    container_name: ${SERVICE:-penguin}-backend
    restart: unless-stopped
    init: true
    env_file: .env
    networks:
      - internal
    volumes:
      - penguin_data:/app/data

  frontend:
    image: mmozzano/penguin-cal-frontend:latest
    container_name: ${SERVICE:-penguin}
    restart: unless-stopped
    init: true
    env_file: .env
    networks:
      - traefik_default
      - internal
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE}.entrypoints=web, websecure"
      - "traefik.http.routers.${SERVICE}.rule=Host(`${SERVICE}.${DOMAIN}`)"
      - "traefik.http.routers.${SERVICE}.tls=true"
      - "traefik.http.routers.${SERVICE}.tls.certresolver=cloudflare"
      - "traefik.http.routers.${SERVICE}.service=${SERVICE}"
      - "traefik.http.services.${SERVICE}.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.${SERVICE}.middlewares=secured@file"
      - homepage.group=${GROUP}
      - homepage.name=${SERVICE_NAME}
      - homepage.icon=calendar.png
      - homepage.href=https://${SERVICE}.${DOMAIN}/
      - homepage.description=${DESCRIPTION}
      # Watchtower
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  penguin_data:

networks:
  traefik_default:
    external: true
  internal:
    driver: bridge