services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=super-secret-key-change-this-for-production
      - TZ=Europe/London
    volumes:
      - penguin_data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  penguin_data: